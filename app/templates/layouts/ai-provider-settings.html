<legend>{{ _('AI writing provider') }}</legend>
<p class="small">{{ _('Configure a compatible AI endpoint for writing assistance. Prompts will be sent to the provider you choose.') }}</p>
<div id="ai-settings-panel" class="padding surface-container" style="border-radius:0.75rem;">
  <div class="field border">
    <select id="ai-provider">
      <option value="environment">{{ _('Use existing environment configuration') }}</option>
      <option value="openai_compatible">{{ _('OpenAI-compatible API') }}</option>
      <option value="ollama">Ollama</option>
      <option value="disabled">{{ _('Disabled') }}</option>
    </select>
    <label>{{ _('AI provider') }}</label>
  </div>
  <div class="field border"><input id="ai-base-url" placeholder="https://api.openai.com/v1"><label>{{ _('Base URL') }}</label></div>
  <div class="field border"><input id="ai-model" placeholder="Model identifier"><label>{{ _('Model') }}</label></div>
  <div class="field border"><input id="ai-api-key" type="password" autocomplete="new-password" placeholder="Enter API key"><label>{{ _('API key (optional for Ollama)') }}</label></div>
  <div class="field border textarea"><textarea id="ai-system-prompt" maxlength="4000" placeholder="Leave blank to use the current system prompt"></textarea><label>{{ _('Custom system prompt') }}</label></div>
  <button type="button" onclick="saveAiSettings()">{{ _('Save AI provider settings') }}</button>
  <p class="small" id="ai-settings-status" role="status"></p>
</div>
<script src="{{ static_versioned('js/ai-settings.js') }}"></script>
